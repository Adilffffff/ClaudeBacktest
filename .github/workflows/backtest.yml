name: Strategy G — Leverage Variants Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run leverage backtest (2x–10x isolated)
        run: python backtest_leverage.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leverage-backtest-results
          path: |
            backtest_leverage_summary.txt
            backtest_leverage_report.json
          retention-days: 30
