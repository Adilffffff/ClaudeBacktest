name: Strategy G Backtest — 8 Variants (15m + 30m)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backtest
        run: python backtest.py

      - name: Upload summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-summary
          path: backtest_summary.txt
          retention-days: 30

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-report
          path: backtest_report.json
          retention-days: 30

      - name: Print summary to log
        if: always()
        run: cat backtest_summary.txt || echo "no summary file"
