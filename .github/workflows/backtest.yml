name: Strategy G — Fixed $1 Per Trade (144 Coins)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backtest (Variant A + B)
        run: python backtest_fixed.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-backtest-results
          path: |
            backtest_fixed_summary.txt
            backtest_fixed_report.json
          retention-days: 30
